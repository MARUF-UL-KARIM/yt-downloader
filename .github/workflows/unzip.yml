name: Unzip downloader-youtube.zip

on:
  push:
    paths:
      - "downloader-youtube.zip"
      - ".github/workflows/unzip.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract ZIP archive
        run: |
          mkdir -p extracted
          unzip -q -o downloader-youtube.zip -d extracted

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extracted

          if git diff --cached --quiet; then
            echo "No extracted files changed."
            exit 0
          fi

          git commit -m "chore: unzip downloader-youtube.zip"
          git push
