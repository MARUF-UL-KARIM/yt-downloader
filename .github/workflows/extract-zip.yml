name: Extract project ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Extract ZIP into repository root
        run: unzip -o downloader-youtube.zip -d .

      - name: Commit extracted files to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "No extracted file changes to commit."
          else
            git commit -m "Extract downloader-youtube.zip"
            git push origin HEAD:main
          fi
